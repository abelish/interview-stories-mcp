[project]
name = "interview-stories-mcp"
version = "0.1.0"
description = "MCP server for storing and retrieving STAR-L-format interview stories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8.1",
    "filelock>=4.0.7",
    "mcp[cli]>=2.2.0",
    "numpy>=2.4.6",
    "snowballstemmer>=3.1.1",
]

[project.scripts]
interview-stories-mcp = "server:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["server.py", "stories", "evals", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
